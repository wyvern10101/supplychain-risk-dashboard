apiVersion: v1
kind: Service
metadata:
  name: supplychain-dashboard-service
  labels:
    app: supplychain-dashboard
spec:
  type: NodePort
  selector:
    app: supplychain-dashboard
  ports:
    - name: http
      protocol: TCP
      port: 8501
      targetPort: 8501
      nodePort: 30501
    - name: metrics
      protocol: TCP
      port: 8000
      targetPort: 8000